[project]
name = "plg-metrics"
version = "0.1.0"
description = "Product-led-growth analytics over event data: ordered funnels, activation search, cohort retention, and rigorous A/B experiment analysis on DuckDB + Parquet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sean Wayne" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/seanmcrae/plg-metrics"

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.scripts]
plg = "plg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy.*", "streamlit.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Streamlit is an optional extra; without it installed its decorators are untyped.
module = ["plg.dashboard"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["plg"]
omit = ["*/plg/dashboard.py"]
